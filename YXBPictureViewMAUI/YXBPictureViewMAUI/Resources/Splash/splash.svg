<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Same design as app icon for consistent branding -->

    <!-- Picture frame border (white) -->
    <rect x="95" y="115" width="266" height="206" fill="#FFFFFF" rx="8"/>

    <!-- Inner picture area (light background) -->
    <rect x="105" y="125" width="246" height="186" fill="#E3F2FD" rx="4"/>

    <!-- Mountain landscape -->
    <path d="M 105,260 L 180,180 L 240,220 L 290,160 L 351,260 Z" fill="#2196F3"/>
    <path d="M 180,220 L 240,180 L 280,200 L 351,260 L 105,260 Z" fill="#1976D2" opacity="0.7"/>

    <!-- Sun -->
    <circle cx="300" cy="160" r="25" fill="#FFC107"/>

    <!-- Lock overlay (encryption symbol) -->
    <g transform="translate(270, 280)">
        <!-- Lock body -->
        <rect x="0" y="10" width="80" height="70" rx="8" fill="#E74C3C"/>

        <!-- Lock shackle -->
        <path d="M 20,10 L 20,-10 A 20,20 0 0,1 60,-10 L 60,10"
              stroke="#E74C3C"
              stroke-width="12"
              fill="none"
              stroke-linecap="round"/>

        <!-- Keyhole -->
        <circle cx="40" cy="40" r="8" fill="#FFFFFF"/>
        <rect x="36" y="40" width="8" height="20" rx="2" fill="#FFFFFF"/>
    </g>
</svg>