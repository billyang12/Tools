<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="456" height="456" fill="#2C3E50" />

    <!-- Image frame/photo background -->
    <rect x="80" y="100" width="296" height="236" rx="12" fill="#34495E" />
    <rect x="95" y="115" width="266" height="206" rx="8" fill="#FFFFFF" />

    <!-- Mountain landscape in the photo -->
    <path d="M 95,260 L 180,180 L 240,220 L 290,160 L 361,260 Z" fill="#3498DB" opacity="0.7" />
    <path d="M 95,280 L 150,220 L 200,250 L 270,190 L 361,280 Z" fill="#2980B9" opacity="0.8" />

    <!-- Sun in the photo -->
    <circle cx="300" cy="160" r="25" fill="#F39C12" opacity="0.9" />

    <!-- Lock symbol (encryption indicator) -->
    <g transform="translate(280, 260)">
        <!-- Lock body -->
        <rect x="0" y="30" width="80" height="70" rx="8" fill="#E74C3C" />
        <rect x="10" y="40" width="60" height="50" rx="4" fill="#C0392B" />

        <!-- Lock shackle -->
        <path d="M 20,30 L 20,10 Q 20,0 30,0 L 50,0 Q 60,0 60,10 L 60,30"
              stroke="#E74C3C" stroke-width="12" fill="none" stroke-linecap="round" />

        <!-- Keyhole -->
        <circle cx="40" cy="60" r="8" fill="#E74C3C" />
        <rect x="36" y="60" width="8" height="20" rx="2" fill="#E74C3C" />
    </g>

    <!-- Border/frame decoration -->
    <rect x="80" y="100" width="296" height="236" rx="12" stroke="#1ABC9C" stroke-width="4" fill="none" />
</svg>
