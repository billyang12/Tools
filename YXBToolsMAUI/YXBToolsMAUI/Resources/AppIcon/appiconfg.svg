<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="toolGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Wrench (main tool) -->
    <g transform="rotate(-30 228 228)">
        <rect x="210" y="80" width="36" height="200" rx="18" fill="url(#toolGradient)"/>
        <circle cx="228" cy="90" r="30" fill="url(#toolGradient)"/>
        <circle cx="228" cy="90" r="15" fill="#1e293b"/>
        <rect x="200" y="260" width="56" height="40" rx="20" fill="url(#toolGradient)"/>
    </g>

    <!-- Screwdriver -->
    <g transform="rotate(30 300 200)">
        <rect x="290" y="150" width="20" height="120" rx="3" fill="#64748b"/>
        <polygon points="290,270 310,270 300,290" fill="#475569"/>
        <rect x="285" y="140" width="30" height="25" rx="3" fill="#fbbf24"/>
    </g>

    <!-- Gear/Cog -->
    <g transform="translate(150, 280)">
        <circle cx="0" cy="0" r="35" fill="#64748b"/>
        <circle cx="0" cy="0" r="15" fill="#1e293b"/>
        <rect x="-5" y="-40" width="10" height="15" fill="#64748b"/>
        <rect x="-5" y="25" width="10" height="15" fill="#64748b"/>
        <rect x="-40" y="-5" width="15" height="10" fill="#64748b"/>
        <rect x="25" y="-5" width="15" height="10" fill="#64748b"/>
    </g>
</svg>
