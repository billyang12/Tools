<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F4F8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bgGradient)"/>

  <!-- Hierarchical tree structure in background -->
  <g opacity="0.15">
    <line x1="50" y1="60" x2="50" y2="200" stroke="white" stroke-width="3"/>
    <line x1="50" y1="80" x2="70" y2="80" stroke="white" stroke-width="3"/>
    <circle cx="75" cy="80" r="4" fill="white"/>
    <line x1="50" y1="120" x2="70" y2="120" stroke="white" stroke-width="3"/>
    <circle cx="75" cy="120" r="4" fill="white"/>
    <line x1="75" y1="120" x2="75" y2="150" stroke="white" stroke-width="2"/>
    <line x1="75" y1="135" x2="95" y2="135" stroke="white" stroke-width="2"/>
    <circle cx="100" cy="135" r="3" fill="white"/>
    <line x1="50" y1="170" x2="70" y2="170" stroke="white" stroke-width="3"/>
    <circle cx="75" cy="170" r="4" fill="white"/>
  </g>

  <!-- Main HN text -->
  <text x="128" y="175" font-family="Arial, sans-serif" font-size="140" font-weight="bold"
        fill="url(#textGradient)" text-anchor="middle" letter-spacing="-5">HN</text>

  <!-- Subtle shadow for depth -->
  <text x="128" y="175" font-family="Arial, sans-serif" font-size="140" font-weight="bold"
        fill="rgba(0,0,0,0.2)" text-anchor="middle" letter-spacing="-5"
        transform="translate(2, 2)">HN</text>
  <text x="128" y="175" font-family="Arial, sans-serif" font-size="140" font-weight="bold"
        fill="url(#textGradient)" text-anchor="middle" letter-spacing="-5">HN</text>
</svg>